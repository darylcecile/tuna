name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check and build release binaries
        run: make check release VERSION="$GITHUB_REF_NAME"
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/tuna_* dist/checksums.txt --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
